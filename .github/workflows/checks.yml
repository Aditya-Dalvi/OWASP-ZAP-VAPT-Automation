name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q blackbox_scanner.py graybox_scanner.py src tests
      - name: Run unit tests
        run: pytest -q
      - name: Check setup script syntax
        run: bash -n zap-setup.sh
